---
- name: Configure observability exporters
  hosts: exporters
  gather_facts: true
  become: true
  roles:
    - role: exporters
  tags:
    - observability
    - exporters

- name: Configure Prometheus
  hosts: prometheus_servers
  gather_facts: false
  become: true
  serial: 1
  pre_tasks:
    - name: Gather Prometheus host facts
      ansible.builtin.setup:
      tags:
        - always
  roles:
    - role: prometheus
  tags:
    - observability
    - prometheus

- name: Configure Grafana
  hosts: grafana_servers
  gather_facts: false
  become: true
  serial: 1
  pre_tasks:
    - name: Gather Grafana host facts
      ansible.builtin.setup:
      tags:
        - always
  roles:
    - role: grafana
  tags:
    - observability
    - grafana

- name: Configure Alertmanager
  hosts: alertmanager_servers
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather Alertmanager host facts
      ansible.builtin.setup:
      tags:
        - always
  roles:
    - role: alertmanager
  tags:
    - observability
    - alertmanager

# The manager must be up before agents try to enroll.
- name: Configure Wazuh
  hosts: all
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather Wazuh host facts
      ansible.builtin.setup:
      tags:
        - always
  roles:
    - role: wazuh
  tags:
    - security
    - wazuh

- name: Configure Wazuh agents
  hosts: all
  gather_facts: false
  become: true
  pre_tasks:
    - name: Gather Wazuh agent host facts
      ansible.builtin.setup:
      tags:
        - always
  roles:
    - role: agents/wazuh-agent
  tags:
    - security
    - wazuh-agent
