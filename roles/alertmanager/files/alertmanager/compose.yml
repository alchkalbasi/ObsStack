---
services:
  alertmanager:
    image: "${ALERTMANAGER_IMAGE:?ALERTMANAGER_IMAGE must be set}"
    container_name: "${ALERTMANAGER_CONTAINER_NAME:-alertmanager}"
    user: "${ALERTMANAGER_USER:?ALERTMANAGER_USER must be set}"
    # Clustering is disabled: this role deploys a single Alertmanager instance.
    command: >-
      --config.file=/etc/alertmanager/config.yml
      --storage.path=/alertmanager
      --web.listen-address=0.0.0.0:9093
      --data.retention=${ALERTMANAGER_DATA_RETENTION:-120h}
      --log.level=${ALERTMANAGER_LOG_LEVEL:-info}
      --cluster.listen-address=
      ${ALERTMANAGER_EXTRA_ARGS:-}
    ports:
      - "${ALERTMANAGER_WEB_LISTEN_ADDRESS:-127.0.0.1:9093}:9093"
    restart: "${ALERTMANAGER_RESTART_POLICY:-unless-stopped}"
    stop_grace_period: "${ALERTMANAGER_STOP_GRACE_PERIOD:-30s}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Mount the project directory, not config.yml alone: Ansible replaces files
      # atomically, and a single-file bind mount would keep the old inode.
      - "./:/etc/alertmanager:ro"
      - "${ALERTMANAGER_DATA_DIR:?ALERTMANAGER_DATA_DIR must be set}:/alertmanager:rw"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider --quiet http://127.0.0.1:9093${ALERTMANAGER_READY_PATH:-/-/ready} || exit 1
      interval: "${ALERTMANAGER_HEALTHCHECK_INTERVAL:-30s}"
      timeout: "${ALERTMANAGER_HEALTHCHECK_TIMEOUT:-5s}"
      retries: "${ALERTMANAGER_HEALTHCHECK_RETRIES:-3}"
      start_period: "${ALERTMANAGER_HEALTHCHECK_START_PERIOD:-10s}"
    logging:
      driver: json-file
      options:
        max-size: "${ALERTMANAGER_LOG_MAX_SIZE:-10m}"
        max-file: "${ALERTMANAGER_LOG_MAX_FILES:-3}"
