---
services:
  snmp-exporter:
    image: "${SNMP_EXPORTER_IMAGE:?SNMP_EXPORTER_IMAGE must be set}"
    container_name: "${SNMP_EXPORTER_CONTAINER_NAME:-snmp-exporter}"
    user: "${SNMP_EXPORTER_USER:-65534:65534}"
    command: >-
      '--config.file=/etc/snmp_exporter/snmp.yml'
      '--web.listen-address=0.0.0.0:9116'
      '--snmp.module-concurrency=${SNMP_EXPORTER_MODULE_CONCURRENCY:-1}'
      ${SNMP_EXPORTER_EXTRA_ARGS:-}
    ports:
      - "${SNMP_EXPORTER_WEB_LISTEN_ADDRESS:-127.0.0.1:9116}:9116"
    restart: "${SNMP_EXPORTER_RESTART_POLICY:-unless-stopped}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - "./snmp.yml:/etc/snmp_exporter/snmp.yml:ro"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:9116/-/healthy
      interval: "${SNMP_EXPORTER_HEALTHCHECK_INTERVAL:-30s}"
      timeout: "${SNMP_EXPORTER_HEALTHCHECK_TIMEOUT:-5s}"
      retries: ${SNMP_EXPORTER_HEALTHCHECK_RETRIES:-3}
      start_period: "${SNMP_EXPORTER_HEALTHCHECK_START_PERIOD:-10s}"
    logging:
      driver: json-file
      options:
        max-size: "${SNMP_EXPORTER_LOG_MAX_SIZE:-10m}"
        max-file: "${SNMP_EXPORTER_LOG_MAX_FILES:-3}"
