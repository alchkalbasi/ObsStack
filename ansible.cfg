[defaults]
# Project layout
inventory = inventories/production/hosts.yml
roles_path = roles:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
collections_path = collections:~/.ansible/collections:/usr/share/ansible/collections
playbook_dir = .

# Output and operator experience
stdout_callback = default
bin_ansible_callbacks = True
display_args_to_stdout = False
display_skipped_hosts = False
display_ok_hosts = True
force_color = True
callback_result_format = yaml

# Production safety defaults
any_errors_fatal = True
retry_files_enabled = False
deprecation_warnings = True
localhost_warning = False

# Inventory hygiene
host_key_checking = True
inventory_ignore_extensions = ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo
inventory_unparsed_warning = True
inject_facts_as_vars = False

# Performance without sacrificing correctness
forks = 25
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout = 86400
internal_poll_interval = 0.001

# Logging and local state
log_path = .ansible/ansible.log
local_tmp = .ansible/tmp
remote_tmp = ~/.ansible/tmp

# Secret handling
no_log = False
# vault_identity_list = production@.vault/pass.txt

# Python interpreter discovery
interpreter_python = auto_silent

[privilege_escalation]
become = False
become_method = sudo
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=3
control_path_dir = .ansible/cp
pipelining = True
retries = 3
timeout = 30
scp_if_ssh = smart
transfer_method = smart

[persistent_connection]
connect_timeout = 30
command_timeout = 60

[diff]
always = False
context = 3
